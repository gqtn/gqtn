# +---+ Tecla Principal +---+
$mainMod = SUPER

# +---+ Monitores e Workspaces +---+
# Configure com a resolução desejada ou use 'preferred,auto,1'
monitor = eDP-1, preferred, auto, 1
monitor = HDMI-A-1, preferred, auto, 1

workspace = 1, monitor:eDP-1
workspace = 7, monitor:HDMI-A-1

# +---+ Startup (Autostart) +---+
exec-once = swaybg -i /home/gabriel/drive/wallpapers/default.png -m fill
exec-once = swaync
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = brightnessctl set 8000
exec-once = waybar
exec-once = insync start

# Hypridle / Swayidle para desligar monitor
exec-once = swayidle -w timeout 300 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'

# +---+ Teclado e Touchpad +---+
input {
    kb_layout = br
    kb_model = abnt2

    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 1.0
    }
}

# +---+ Apagando SwayFX / Definindo Estilo Visual +---+
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2

    # Cores convertidas do seu tema ($lightblue e $darkblue)
    col.active_border = rgba(5294e2ff)
    col.inactive_border = rgba(08052bff)

    layout = dwindle
}

decoration {
    rounding = 10

    shadow {
        enabled = true
        range = 15
        render_power = 3
    }

    blur {
        enabled = true
        size = 5
        passes = 3
    }
}

animations {
    enabled = true

    # Cria uma curva de aceleração rápida
    bezier = snappy, 0.05, 0.9, 0.1, 1.0

    # Aplica a curva com tempos muito curtos (ex: 2 ou 3)
    animation = windows, 1, 2, snappy
    animation = windowsOut, 1, 2, snappy, popin 80%
    animation = border, 1, 3, default
    animation = borderangle, 1, 3, default
    animation = workspaces, 1, 2, snappy
}

# +---+ Atalhos de Aplicativos e Sistema +---+
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, Q, killactive,
bind = $mainMod, D, exec, rofi -c ~/.config/rofi/config.rasi -modi drun -show drun
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = CTRL $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, Q, exit,

# Estado de Janelas
bind = $mainMod, F, togglefloating,
bind = $mainMod, F11, fullscreen,

# Foco nas Janelas (Setas e HJKL)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Mover Janelas
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# +---+ Workspaces +---+
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover Janela para Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# +---+ Modo Redimensionamento +---+
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# +---+ Teclas de Mídia e Brilho +---+
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute, exec, pamixer -t
bindel = , XF86AudioMicMute, exec, pamixer --default-source -t

bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# +---+ Screenshots +---+
bind = , Print, exec, grim "/tmp/$(date '+%H:%M-%d.%m.%y').png"
bind = SHIFT, Print, exec, slurp | grim -g - "/tmp/$(date '+%H:%M-%d.%m.%y').png"
bind = CTRL SHIFT, Print, exec, hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"' | slurp | grim -g - - | wl-copy
